{% extends "base.html" %}
{% block content %}
<h1>Accounts</h1>
<form class="filters" method="get" action="/" hx-get="/" hx-target="#rows" hx-push-url="true">
  <label>Name <input type="search" name="q" value="{{ form.q }}" placeholder="contains"></label>
  <label>Segment
    <select name="segment">
      <option value="" {% if not form.segment %}selected{% endif %}>any</option>
      {% for s in ["untouched", "partially_covered", "displace", "low_surface"] %}
      <option value="{{ s }}" {% if form.segment == s %}selected{% endif %}>{{ s }}</option>
      {% endfor %}
    </select>
  </label>
  <label>Country <input name="country" value="{{ form.country }}" size="3" placeholder="US"></label>
  <label>Industry <input name="industry" value="{{ form.industry }}" size="12"></label>
  <label>Min exposure <input type="number" name="min_exposure" min="0" max="100" step="1"
         value="{{ form.min_exposure }}" size="4"></label>
  <label>Sort
    <select name="sort">
      {% for s in ["priority", "exposure", "n_banners", "recent_change"] %}
      <option value="{{ s }}" {% if form.sort == s %}selected{% endif %}>{{ s }}</option>
      {% endfor %}
    </select>
  </label>
  <button type="submit">Apply</button>
</form>
<div id="rows">{% include "_rows.html" %}</div>
{% endblock %}
