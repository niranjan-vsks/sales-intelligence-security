<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Overview{% endblock %} · Sales intelligence</title>
  <meta name="description" content="Ranked accounts from internet-exposure evidence, with the reasons behind each rank.">
  <link rel="icon" href="data:,">
  <script>
    try { var t = localStorage.getItem("theme"); if (t === "light") document.documentElement.dataset.theme = "light"; } catch (e) {}
  </script>
  <link rel="stylesheet" href="{{ url_for('static', path='tokens.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  <script src="https://unpkg.com/htmx.org@1.9.12" integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2XoQrxeTUQyRjrOnlCoYta87iKBWq3EsdM2" crossorigin="anonymous" defer></script>
  <script src="{{ url_for('static', path='app.js') }}" defer></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="site">
    <div class="site-in">
      <a class="brand" href="/">
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><rect x="2" y="11" width="4" height="7" rx="1" fill="currentColor" opacity=".45"/><rect x="8" y="7" width="4" height="11" rx="1" fill="currentColor" opacity=".7"/><rect x="14" y="2" width="4" height="16" rx="1" fill="var(--accent)"/></svg>
        <span>Sales intelligence</span>
      </a>
      <nav class="nav" aria-label="Main">
        <a href="/" {% if nav == "overview" %}aria-current="page"{% endif %}>Overview</a>
        <a href="/accounts" {% if nav == "accounts" %}aria-current="page"{% endif %}>Accounts</a>
        <a href="/about" {% if nav == "about" %}aria-current="page"{% endif %}>About</a>
      </nav>
      <div class="site-end">
        <span class="bundle" title="Bundle version">{{ meta.bundle_version }}</span>
        <button type="button" class="icon-btn" id="theme-toggle" aria-label="Switch to light theme">
          <svg class="i-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        </button>
      </div>
    </div>
  </header>
  <main id="main" class="{% block main_class %}wrap{% endblock %}">{% block content %}{% endblock %}</main>
  <footer class="site-foot">
    <div class="wrap">
      Bundle {{ meta.bundle_version }} · scoring {{ meta.scoring_version }} ·
      ROLLUP_MAX_IPS {{ rollup_max_ips }} · {{ "{:,}".format(meta.n_accounts) }} accounts
    </div>
  </footer>
</body>
</html>
