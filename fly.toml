# 1 machine, shared-cpu-1x, 1 GB (DESIGN.md 9). The image is built locally with the bundle as a
# named build context and pushed to registry.fly.io; docs/DEPLOY.md has the commands.
app = "sis-niranjan"
primary_region = "fra"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
