[project]
name = "sis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "logfire[fastapi]>=5.4.0",
    "markdown>=3.11.2",
    "openai>=3.42.1",
    "orjson>=3.13.0",
    "pyarrow>=26.0.0",
    "pydantic>=2",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "tldextract>=5.4.0",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
    "zstandard>=0.25.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "types-markdown>=3.11.2.20261029",
    "types-pyyaml>=6.0.12.20261030",
]

[project.scripts]
sis = "sis.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Plain `pytest` skips eval and llm; the audit (-m "not llm") and `-m eval` override this.
addopts = "-m 'not eval and not llm'"
markers = [
    "eval: ranking-quality evaluation on the committed fixture bundle (P4)",
    "llm: calls a live LLM and costs money",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# findings/ is the explorer's read-only record; .claude/ holds copied skills.
extend-exclude = ["findings", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"sis/cli.py" = ["B008"]  # typer declares arguments as call defaults

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true
