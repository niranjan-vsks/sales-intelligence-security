# Operator rules for entity resolution step 3 (DESIGN.md 4, cards/P3_1.md defect 1).
# A domain-kind key that matches either rule is an operator: it names a hosting provider's
# address space, not a customer, even when it covers fewer than ROLLUP_MAX_IPS addresses.

# Rule 1, template zone. The registered domain itself encodes an IP fragment, as hosters'
# per-/24 reverse-DNS zones do (ip-15-235-134.net). Case insensitive, matched on key_value;
# a digit group is required, so ip-cam-shop.com is not a zone.
template_zone_patterns:
  - '^(ip|host|static|dyn|dynamic|rev|ptr|srv|vps|cust|customer|node|server|pool|cpe)[-.]?\d{1,3}([-.]\d{1,3}){1,3}\.'
  - '^\d{1,3}([-.]\d{1,3}){2,3}\.'

# Rule 2, templated hostnames. A hoster's zone names its servers from an address or a serial
# (222-98-223-67-static.prioritycolo.com): a first hostname label with 2 or more digit groups.
template_label_pattern: '\d+\D+\d+'
# Below 10 addresses a share is too noisy to call a whole zone templated.
template_min_ips: 10
# A business zone has some numbered hosts; a hoster's zone is almost all numbered hosts.
template_share: 0.8
