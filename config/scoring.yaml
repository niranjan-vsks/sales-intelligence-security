# Constants from DESIGN.md sections 5.2 and 5.3. Hand-set from the Stage 1 lifts, not fitted.
# Any change to a number here bumps scoring_version (cards/P3.md).
scoring_version: "1.1.0"

facts:
  a:
    weights:
      eol: 1.0              # A_eol
      cves_base: 0.4        # A_inferred_cves > 0 -> cves_base + cves_cvss * A_max_cvss / 10
      cves_cvss: 0.6
      fingerprinted: 0.25   # A_fingerprinted
      os_leak: 0.15         # A_os_leak
      cpe_per_header: 0.20  # pct(A_cpe_per_header)
  b:
    weights:
      self_signed: 0.6      # B_self_signed
      expired: 0.6          # B_expired
      legacy_tls: 0.4       # B_legacy_tls
      cert_age: 0.3         # pct(B_cert_age_days)
  c:
    weights:
      admin_services: 0.40       # min(C_admin_services, caps.admin_services) / caps.admin_services
      windows_internals: 0.25    # C_windows_internals
      asset_tags: 0.20           # min(C_asset_tags, caps.asset_tags) / caps.asset_tags
      breadth_modules: 0.25      # pct(C_breadth_modules)
      components_vs_peers: 0.15  # pct(C_components_vs_peers)
    caps:
      admin_services: 3
      asset_tags: 2
  d:
    weights:
      waf: 1.0
      security_appliance: 0.8
      edge_substitute: 0.5
      vpn: 0.4
      hardening_headers: 0.3

exposure:
  weights:
    a: 0.45
    b: 0.20
    c: 0.35

# The prerequisite: something of theirs answered the internet (DESIGN.md 5.3). Any of these
# signals > 0 makes an entity reachable; with none it is low_surface. 1.1.0 added C_any_service
# (cards/P3_1.md defect 2): provider-tested banners often carry no payload and no http 200.
prerequisite: [C_live_web, C_admin_services, C_asset_tags, C_any_service]

segments:
  multipliers:
    untouched: 1.0
    partially_covered: 0.85
    displace: 0.6
    low_surface: 0.5

peer:
  # [low, high] inclusive on n_modules; null = open-ended
  breadth_buckets: [[1, 1], [2, 3], [4, 9], [10, null]]
